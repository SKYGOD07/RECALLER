[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recaller"
version = "1.0.0"
description = "RECALLER — AI agentic credit underwriter for thin-file green borrowers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "anthropic>=1.0",
    "instructor>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
recaller = "recaller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["recaller*"]

[tool.setuptools.package-data]
"recaller.ai.hermes" = ["THIRD_PARTY_NOTICES.md", "skills/*/SKILL.md", "skills/*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
