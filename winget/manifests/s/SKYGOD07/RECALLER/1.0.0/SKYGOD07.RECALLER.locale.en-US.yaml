ShortDescription: Deterministic AI agentic credit underwriting engine and loan officer console for thin-file EV borrowers.
Description: |-
  RECALLER is a deterministic, AI agentic credit underwriting engine and loan officer console built in Python.
  It provides:
  - 100% integer-paise financial arithmetic and exact FOIR/LTV calculations.
  - FNV-1a 128-bit hash-chained immutable audit ledgers.
  - Policy engine with hierarchical precedence and unambiguous reason codes.
  - Real-time what-if solvers and counterfactual recommendation engines.
  - Sandboxed agent runtime with strict tool boundary enforcement.
  - High-performance loan officer console served locally on Windows.
